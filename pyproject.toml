[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "policy-evidence-ledger"
version = "0.1.0"
description = "A local-first workspace for traceable, reproducible policy research."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Moayd Ghazzawi" }]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-cov>=6.2,<7", "ruff>=0.12,<1"]

[project.scripts]
policy-evidence-ledger = "policy_evidence_ledger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_evidence_ledger"]
force-include = { "demo/manifest.json" = "policy_evidence_ledger/demo_manifest.json" }

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
