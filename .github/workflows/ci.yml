name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e '.[dev]'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:python
      - run: npm run format:check
      - run: npm run audit:tracked
      - run: npm run audit:dependencies
      - run: npm run audit:dependencies:all
      - run: npm run test:python
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://policy-evidence-ledger.moaydghazzawi.com
      - run: npm run test:ui

  python-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e '.[dev]'
      - run: .venv/bin/ruff check .
      - run: PYTHONDONTWRITEBYTECODE=1 .venv/bin/pytest -p no:cacheprovider
